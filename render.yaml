services:
  - type: web
    name: intellipath
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.2.0
      - key: DB_PATH
        value: data/intellipath.db
